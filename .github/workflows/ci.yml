name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  python:
    name: python core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.0"
      - run: uv sync --locked --all-extras
      - name: lint
        run: |
          uv run ruff check zeitgeber tests/zeitgeber scripts
          uv run ruff format --check zeitgeber tests scripts
      - name: typecheck
        run: uv run mypy zeitgeber tests/zeitgeber
      - name: test
        run: uv run pytest tests/zeitgeber

  api:
    name: api
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.0"
      - run: uv sync --locked --all-extras
      - name: lint
        run: |
          uv run ruff check api tests/api
          uv run ruff format --check api tests/api
      - name: requirements match the lock file
        run: |
          uv export --frozen --no-dev --extra api --no-emit-project --no-hashes --format requirements-txt > /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt
      - name: typecheck
        run: uv run mypy api tests/api
      - name: test
        run: uv run pytest tests/api

  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: |
          pnpm lint
          pnpm format:check
      - name: typecheck
        run: pnpm typecheck
      - name: test
        run: pnpm test
      - name: build
        run: pnpm build
