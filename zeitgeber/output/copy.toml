# Every user-facing string in plan outputs, in English (en) and Taglish (tl).
# docs/COPY_REVIEW.md is generated from this file (scripts/copy_review.py). Edit here.
# Placeholders in braces are filled from the plan; en and tl must use the same set.
# "where" says where the string appears.

[weekdays]
en = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
tl = ["Lun", "Mar", "Miy", "Huw", "Biy", "Sab", "Lin"]

# Disclaimers: top of the timeline, the JSON plan and the calendar description.

[strings."disclaimer.wellness"]
where = "disclaimer"
en = "Zeitgeber is a wellness planning tool, not medical advice."
tl = "Ang Zeitgeber ay wellness planning tool, hindi medical advice."

[strings."disclaimer.doctor"]
where = "disclaimer"
en = "If you have a sleep condition, are pregnant or have a health condition, talk to a doctor before changing your sleep."
tl = "Kung may problema ka sa tulog, buntis ka, o may health condition, kausapin muna ang doktor bago baguhin ang tulog mo."

[strings."disclaimer.model"]
where = "disclaimer"
en = "The times come from a body-clock model. Your body may differ, so adjust a time if it does not suit you."
tl = "Galing sa body-clock model ang mga oras. Pwedeng iba ang katawan mo, kaya i-adjust ang oras kung hindi bagay sa iyo."

