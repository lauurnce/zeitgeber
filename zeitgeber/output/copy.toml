# Nudges: one per plan event, shown in the app and as calendar reminders.

[strings."nudge.sunglasses"]
where = "nudge"
en = "Shades on for the ride home, even if it is cloudy. Morning light tells your body it is morning. We want it to stay night for your body until you fall asleep."
tl = "Shades on pauwi, kahit maulap. Ang liwanag sa umaga ang nagsasabi sa katawan mo na umaga na. Gusto nating gabi pa rin para sa kanya hanggang makatulog ka."

[strings."nudge.caffeine"]
where = "nudge"
en = "{end} is your last coffee. Water after that, so you fall asleep more easily when you get home."
tl = "{end} ang huling kape mo. Tubig na lang pagkatapos, para madali kang makatulog pag-uwi."

[strings."nudge.light_seek"]
where = "nudge"
en = "{start} to {end}: stay in the brightest spot you can. This helps move your body clock toward your night schedule."
tl = "{start} hanggang {end}: dito ka sa pinakamaliwanag na pwesto. Ito ang tumutulong ilipat ang body clock mo papunta sa night schedule."

[strings."nudge.sleep_low"]
where = "nudge, when the body-clock low falls inside this sleep"
en = "Lights out by {start}. Blackout curtains on, phone face down. Sleep now, while your body clock is at its lowest."
tl = "Lights out na by {start}. Sarado ang blackout curtains, nakataob ang phone. Matulog ka na habang pinakamababa ang body clock mo."

[strings."nudge.sleep"]
where = "nudge, when the body-clock low falls outside this sleep"
en = "Lights out by {start}. Blackout curtains on, phone face down. A dark room helps you sleep through to {end}."
tl = "Lights out na by {start}. Sarado ang blackout curtains, nakataob ang phone. Mas tuloy-tuloy ang tulog mo hanggang {end} kapag madilim ang kwarto."

[strings."nudge.rest_sleep"]
where = "nudge"
en = "Rest day: sleep from {start} to {end}. A late night keeps your body clock close to your work nights."
tl = "Rest day: tulog ka mula {start} hanggang {end}. Ang medyo late na tulog ang nagpapanatili sa body clock mo na malapit sa work nights mo."

[strings."nudge.light_brake"]
where = "nudge"
en = "Go outside for {minutes} minutes at {start}. Daylight after you wake keeps your body clock from drifting too late."
tl = "Lumabas ka nang {minutes} minuto sa {start}. Ang liwanag ng araw pagkagising ang pumipigil na masyadong ma-late ang body clock mo."

[strings."nudge.nap"]
where = "nudge"
en = "Nap from {start} to {end} before work. Set an alarm and get up when it rings."
tl = "Idlip muna mula {start} hanggang {end} bago pumasok. Mag-alarm ka at bumangon pagtunog nito."

# Recommendations: the "what to change" list.

[strings."rec.sunglasses.cat3"]
where = "recommendation"
en = "Wear dark sunglasses (category 3) on the commute home whenever the sun is up."
tl = "Mag-shades (category 3) sa biyahe pauwi tuwing may araw."

[strings."rec.sunglasses.dark"]
where = "recommendation"
en = "Wear very dark sunglasses on the commute home whenever the sun is up. Only if you are not the one driving."
tl = "Mag-suot ng napakadilim na shades sa biyahe pauwi tuwing may araw. Para lang ito kung hindi ikaw ang nagmamaneho."

[strings."rec.sleep"]
where = "recommendation"
en = "After each night shift, sleep from {start} to {end} in a dark room."
tl = "Pagkatapos ng bawat night shift, matulog mula {start} hanggang {end} sa madilim na kwarto."

[strings."rec.rest_day"]
where = "recommendation"
en = "On rest days, sleep from {start} to {end}."
tl = "Sa rest days, matulog mula {start} hanggang {end}."

[strings."rec.light_brake"]
where = "recommendation"
en = "After day sleep, go outside for {minutes} minutes at {start}."
tl = "Pagkatapos ng tulog sa araw, lumabas nang {minutes} minuto sa {start}."

[strings."rec.light_seek"]
where = "recommendation"
en = "During your shift, stay in the brightest spot you can from {start} to {end}."
tl = "Habang naka-shift, pumwesto sa pinakamaliwanag na lugar mula {start} hanggang {end}."

[strings."rec.nap"]
where = "recommendation"
en = "Nap from {start} to {end} before leaving for work."
tl = "Umidlip mula {start} hanggang {end} bago umalis papasok."

[strings."rec.caffeine"]
where = "recommendation"
en = "Have caffeine only from {start} to {end}, then switch to water."
tl = "Kape lang mula {start} hanggang {end}, tapos tubig na."

[strings."rec.keep"]
where = "recommendation, when no change scores better"
en = "Your current schedule scored as well as any plan we tried. Keep it as it is."
tl = "Kasing-ayos na ng kahit anong plan na sinubukan namin ang schedule mo ngayon. Ituloy mo lang."

# Explanations: why each change is in the plan.

[strings."change.sunglasses"]
where = "explanation, name of the change"
en = "Sunglasses on the way home"
tl = "Shades pauwi"

[strings."change.sleep_start_offset_h"]
where = "explanation, name of the change"
en = "Day sleep start"
tl = "Simula ng tulog sa araw"

[strings."change.sleep_len_h"]
where = "explanation, name of the change"
en = "Day sleep length"
tl = "Haba ng tulog sa araw"

[strings."change.rest_day"]
where = "explanation, name of the change"
en = "Rest-day sleep"
tl = "Tulog sa rest day"

[strings."change.light_brake"]
where = "explanation, name of the change"
en = "Outdoors after waking"
tl = "Labas pagkagising"

[strings."change.light_seek_start_h"]
where = "explanation, name of the change"
en = "Bright light during the shift"
tl = "Liwanag habang naka-shift"

[strings."change.nap_len_min"]
where = "explanation, name of the change"
en = "Pre-shift nap"
tl = "Idlip bago mag-shift"

[strings."explain.score"]
where = "explanation"
en = "{change}: without it, the misalignment score goes from {with} h to {without} h."
tl = "{change}: kung wala ito, ang misalignment score ay magiging {without} h mula {with} h."

[strings."explain.cost"]
where = "explanation, when the change on its own raises the score"
en = "{change}: on its own this raises the misalignment score from {without} h to {with} h, but the plan as a whole works better with it."
tl = "{change}: kung ito lang, tumataas ang misalignment score mula {without} h hanggang {with} h, pero mas maayos ang buong plan kapag kasama ito."

[strings."explain.sleep_floor"]
where = "explanation, when a longer day sleep raises the score"
en = "{change}: a shorter sleep would score {without} h instead of {with} h, but the plan keeps at least {hours} hours of sleep."
tl = "{change}: mas mababa sana ang score sa mas maikling tulog ({without} h imbes na {with} h), pero sinisigurado ng plan na may {hours} oras ka man lang na tulog."

[strings."explain.needed"]
where = "explanation, when the plan does not work without the change"
en = "{change}: the rest of the plan does not fit without it."
tl = "{change}: hindi kakasya ang natitirang plan kung wala ito."

# Timeline: the plain-text daily view.

[strings."timeline.title"]
where = "timeline"
en = "Your {days}-day plan from {date}"
tl = "Ang {days}-day plan mo simula {date}"

[strings."timeline.timezone"]
where = "timeline"
en = "All times are {tz} time."
tl = "Lahat ng oras ay {tz} time."

[strings."timeline.changes"]
where = "timeline"
en = "What to change"
tl = "Mga babaguhin"

[strings."timeline.why"]
where = "timeline"
en = "Why"
tl = "Bakit"

[strings."timeline.score"]
where = "timeline"
en = "Misalignment score: {before} h now, {after} h with the plan. Lower is better."
tl = "Misalignment score: {before} h ngayon, {after} h sa plan. Mas mababa, mas maganda."

[strings."timeline.cross_check"]
where = "timeline"
en = "A second body-clock model gives {before} h now and {after} h with the plan."
tl = "Sa pangalawang body-clock model, {before} h ngayon at {after} h sa plan."

[strings."timeline.days"]
where = "timeline"
en = "Day by day"
tl = "Bawat araw"

[strings."timeline.next_day"]
where = "timeline, after an end time on the following day"
